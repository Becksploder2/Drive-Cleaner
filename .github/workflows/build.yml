name: Build Drive Detective Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install --upgrade pyinstaller
      - name: Build standalone app
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DriveDetective app.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: DriveDetective-Windows
          path: dist/DriveDetective.exe
          if-no-files-found: error
